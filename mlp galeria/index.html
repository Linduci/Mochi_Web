<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLP Gallery</title>
  <link rel="stylesheet" href="../gallery.css">
  <link rel="stylesheet" href="../navigation.css">
  <link rel="stylesheet" href="../gallery-theme.css">
  <link rel="stylesheet" href="loader.css">
  <script src="../gallery.js" defer></script>
</head>
<body>
  <script src="loader.js"></script>
  <nav class="site-nav" aria-label="Main navigation">
    <a class="site-nav__home" href="../index.html"><span aria-hidden="true">&larr;</span> Back to main menu</a>
  </nav>
  <main>
    <h1>MLP Gallery</h1>
    <p class="gallery-help">Open a photo! Use the arrow buttons or swipe to browse. Pinch, double-tap, or press + to zoom.</p>
    <div class="gallery" id="gallery">
    <a class="gallery-item" href="optimized/1.jpg" data-original="photom/1.jpg" aria-label="Open MLP Gallery photo 1"><img src="optimized/1-thumb.jpg" width="480" height="270" alt="MLP Gallery – photo 1" loading="eager" decoding="async"></a>
    <a class="gallery-item" href="optimized/2.jpg" data-original="photom/2.jpg" aria-label="Open MLP Gallery photo 2"><img src="optimized/2-thumb.jpg" width="480" height="270" alt="MLP Gallery – photo 2" loading="eager" decoding="async"></a>
    <a class="gallery-item" href="optimized/3.jpg" data-original="photom/3.jpg" aria-label="Open MLP Gallery photo 3"><img src="optimized/3-thumb.jpg" width="480" height="270" alt="MLP Gallery – photo 3" loading="lazy" decoding="async"></a>
    <a class="gallery-item" href="optimized/4.jpg" data-original="photom/4.jpg" aria-label="Open MLP Gallery photo 4"><img src="optimized/4-thumb.jpg" width="480" height="270" alt="MLP Gallery – photo 4" loading="lazy" decoding="async"></a>
    <a class="gallery-item" href="optimized/6.jpg" data-original="photom/6.jpg" aria-label="Open MLP Gallery photo 5"><img src="optimized/6-thumb.jpg" width="480" height="270" alt="MLP Gallery – photo 5" loading="lazy" decoding="async"></a>
    </div>
  </main>
</body>
</html>
